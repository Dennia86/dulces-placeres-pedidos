<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#EF7C8E">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>Dulces Placeres — Pedidos</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#fdf6f7;color:#1a1a1a;font-size:14px}
.app{max-width:820px;margin:0 auto;padding:1.5rem 1rem}
h1{font-size:20px;font-weight:600;margin-bottom:4px;color:#1a1a1a}
.subtitle{font-size:13px;color:#999;margin-bottom:1.5rem}
.nav{display:flex;gap:8px;margin-bottom:1.5rem;border-bottom:1px solid #f0dde0;padding-bottom:1rem}
.tab{background:transparent;border:1px solid #e8cdd0;border-radius:8px;padding:8px 18px;font-size:13px;cursor:pointer;color:#999;transition:all .15s}
.tab.active{background:#EF7C8E;color:#fff;border-color:#EF7C8E;font-weight:500}
.tab:not(.active):hover{background:#fdeef0;border-color:#EF7C8E;color:#EF7C8E}
.view{display:none}.view.active{display:block}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.form-grid.full{grid-template-columns:1fr}
label{font-size:11px;color:#999;display:block;margin-bottom:4px;text-transform:uppercase;letter-spacing:.04em}
input,select,textarea{width:100%;font-size:13px;padding:9px 11px;border:1px solid #e8dde0;border-radius:8px;background:#fff;color:#1a1a1a;outline:none;transition:border .15s}
input:focus,select:focus,textarea:focus{border-color:#EF7C8E}
textarea{resize:vertical;min-height:60px}
.section-title{font-size:11px;font-weight:600;color:#ccc;margin:1.25rem 0 8px;text-transform:uppercase;letter-spacing:.06em}
.product-row{display:grid;grid-template-columns:2fr 70px 110px 32px;gap:8px;align-items:end;margin-bottom:8px}
.btn{border:1px solid #e0d5d8;background:#fff;border-radius:8px;padding:9px 16px;font-size:13px;cursor:pointer;color:#555;transition:all .12s}
.btn:hover{background:#fdeef0;border-color:#EF7C8E;color:#EF7C8E}
.btn-primary{background:#EF7C8E;color:#fff;border-color:#EF7C8E;font-weight:500}
.btn-primary:hover{background:#e86070;border-color:#e86070}
.btn-teal{background:#769E94;color:#fff;border-color:#769E94;font-weight:500}
.btn-teal:hover{background:#628880;border-color:#628880}
.btn-sm{padding:6px 12px;font-size:12px}
.btn-icon{width:32px;height:32px;padding:0;display:flex;align-items:center;justify-content:center;border-radius:8px;border:1px solid #e8dde0;background:#fff;cursor:pointer;color:#bbb}
.btn-icon:hover{background:#fff0f0;color:#EF7C8E;border-color:#EF7C8E}
.total-bar{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;background:#fff;border:1px solid #f0dde0;border-radius:10px;margin:1rem 0}
.total-bar span{font-size:13px;color:#999}
.total-bar strong{font-size:20px;font-weight:600;color:#EF7C8E}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:1.25rem}
.card{background:#fff;border:1px solid #f0dde0;border-radius:12px;padding:1rem 1.25rem;margin-bottom:12px}
.card.done{opacity:.5}
.pedido-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
.pedido-nombre{font-size:15px;font-weight:600;color:#1a1a1a}
.pedido-meta{font-size:12px;color:#aaa;margin-top:3px;line-height:1.8}
.badge{display:inline-block;font-size:11px;padding:3px 10px;border-radius:6px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.badge-pendiente{background:#fff3e0;color:#e67e22}
.badge-entregado{background:#eaf3f1;color:#769E94}
.badge-saldo{background:#fdeef0;color:#EF7C8E}
.productos-lista{border-top:1px solid #fceef0;padding-top:10px;margin-top:10px}
.prod-item{display:flex;justify-content:space-between;align-items:center;padding:6px 0;font-size:13px}
.prod-item.entregado .prod-nombre{text-decoration:line-through;color:#ccc}
.prod-nombre{color:#1a1a1a}
.prod-precio{color:#aaa;font-size:12px}
.check-btn{width:24px;height:24px;border-radius:50%;border:1.5px solid #e0d5d8;background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-right:10px;transition:all .15s;color:#fff}
.check-btn.done{background:#769E94;border-color:#769E94}
.prod-row-inner{display:flex;align-items:center;flex:1}
.pedido-footer{display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding-top:10px;border-top:1px solid #fceef0}
.pedido-total{font-size:13px;color:#aaa}
.pedido-total strong{color:#1a1a1a;font-weight:600}
.filtros{display:flex;gap:8px;margin-bottom:1rem;align-items:center;flex-wrap:wrap}
.filtros select,.filtros input{max-width:200px}
.empty{text-align:center;padding:3rem 1rem;color:#ccc;font-size:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:1.5rem}
.stat{background:#fff;border:1px solid #f0dde0;border-radius:10px;padding:1rem;text-align:center}
.stat-val{font-size:26px;font-weight:600;color:#EF7C8E}
.stat-lbl{font-size:11px;color:#bbb;margin-top:3px;text-transform:uppercase;letter-spacing:.04em}
.saldo-chip{font-size:11px;padding:2px 8px;border-radius:6px;background:#fdeef0;color:#EF7C8E;font-weight:500;margin-left:6px}

/* Modal WhatsApp */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;z-index:999;padding:1rem}
.modal{background:#fff;border-radius:14px;padding:1.5rem;width:100%;max-width:520px;box-shadow:0 8px 32px rgba(0,0,0,.12)}
.modal h3{font-size:16px;font-weight:600;margin-bottom:4px;color:#1a1a1a}
.modal p{font-size:12px;color:#aaa;margin-bottom:1rem}
.modal textarea{min-height:180px;font-size:13px;line-height:1.6;border-color:#e8dde0}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:1rem}
.wa-btn{background:#25D366;color:#fff;border:none;border-radius:8px;padding:9px 18px;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px}
.wa-btn:hover{background:#1ebe5a}
</style>
</head>

        <div id="envio-desglose" style="font-size:11px;color:#bbb;margin-top:2px;display:none"></div>
      </div>
      <strong id="total-display">₡0</strong>
    </div>

    <p class="section-title">Pago</p>
    <div class="form-grid">
      <div><label>Monto recibido (₡)</label><input type="number" id="f-pagado" placeholder="0" oninput="calcSaldo()"></div>
      <div><label>Saldo pendiente</label><input type="text" id="f-saldo" readonly style="color:#EF7C8E;font-weight:600"></div>
    </div>
    <div class="form-grid full">
      <div><label>Notas adicionales</label><textarea id="f-notas" placeholder="Alergias, instrucciones especiales..."></textarea></div>
    </div>
    <div class="actions">
      <button class="btn" onclick="resetForm()">Limpiar</button>
      <button class="btn btn-primary" id="btn-guardar" onclick="console.log('click OK');guardarPedido()"><i class="ti ti-device-floppy"></i> Guardar pedido</button>
    </div>
  </div>

  <!-- PRODUCCIÓN -->
  <div id="view-produccion" class="view">
    <div class="stats" id="stats-bar"></div>
    <div class="filtros">
      <input type="date" id="filtro-fecha" onchange="renderProduccion()">
      <select id="filtro-estado" onchange="renderProduccion()">
        <option value="">Todos</option>
        <option value="pendiente">Pendientes</option>
        <option value="entregado">Entregados</option>
      </select>
      <button class="btn btn-sm" onclick="limpiarFiltros()">Limpiar</button>
    </div>
    <div id="produccion-lista"></div>
  </div>

  <!-- REGISTRO -->
  <div id="view-registro" class="view">
    <div class="filtros">
      <input type="text" id="buscar" placeholder="Buscar clienta o producto..." oninput="renderRegistro()" style="max-width:280px">
      <select id="filtro-mes" onchange="renderRegistro()">
        <option value="">Todos los meses</option>
        <option>enero</option><option>febrero</option><option>marzo</option>
        <option>abril</option><option>mayo</option><option>junio</option>
        <option>julio</option><option>agosto</option><option>septiembre</option>
        <option>octubre</option><option>noviembre</option><option>diciembre</option>
      </select>
    </div>
    <div id="registro-lista"></div>
  </div>

  <!-- CORTES -->
  <div id="view-cortes" class="view">
    <p class="section-title">Período del corte</p>
    <div class="form-grid">
      <div><label>Fecha desde</label><input type="date" id="c-desde"></div>
      <div><label>Fecha hasta</label><input type="date" id="c-hasta"></div>
    </div>
    <div class="form-grid">
      <div>
        <label>O filtrar por mes</label>
        <select id="c-mes" onchange="preselecionarMes()">
          <option value="">— Elegir mes —</option>
          <option>enero</option><option>febrero</option><option>marzo</option>
          <option>abril</option><option>mayo</option><option>junio</option>
          <option>julio</option><option>agosto</option><option>septiembre</option>
          <option>octubre</option><option>noviembre</option><option>diciembre</option>
        </select>
      </div>
      <div>
        <label>Estado</label>
        <select id="c-estado">
          <option value="">Todos</option>
          <option value="entregado">Solo entregados</option>
          <option value="pendiente">Solo pendientes</option>
        </select>
      </div>
    </div>
    <div style="display:flex;gap:8px;margin-top:8px">
      <button class="btn btn-primary" onclick="previsualizarCorte()"><i class="ti ti-eye"></i> Previsualizar</button>
      <button class="btn btn-teal" onclick="exportarExcel()"><i class="ti ti-file-spreadsheet"></i> Descargar Excel</button>
    </div>
    <div id="corte-preview" style="margin-top:1.5rem"></div>
  </div>

  <!-- CONFIGURACIÓN -->
  <div id="view-config" class="view">
    <p class="section-title">Gestión de productos</p>
    <div class="card" style="margin-bottom:1rem">
      <div style="display:flex;gap:8px;align-items:flex-end">
        <div style="flex:1"><label>Nombre del producto</label><input type="text" id="nuevo-producto" placeholder="Ej: Cheesecake Maracuyá"></div>
        <button class="btn btn-primary" onclick="agregarProductoCatalogo()">Agregar</button>
      </div>
    </div>
    <div id="catalogo-lista"></div>
  </div>
</div>

<!-- MODAL WHATSAPP -->
<div class="modal-overlay" id="wa-modal" style="display:none" onclick="if(event.target===this)cerrarModal()">
  <div class="modal">
    <h3><i class="ti ti-brand-whatsapp" style="color:#25D366"></i> Confirmar pedido por WhatsApp</h3>
    <p>Podés editar el mensaje antes de enviarlo.</p>
    <textarea id="wa-msg"></textarea>
    <div class="modal-actions">
      <button class="btn btn-sm" onclick="cerrarModal()">Cancelar</button>
      <button class="wa-btn" onclick="enviarWA()"><i class="ti ti-brand-whatsapp"></i> Abrir en WhatsApp</button>
    </div>
  </div>
</div>

<script>
// ==================== FIREBASE ====================
firebase.initializeApp({
  apiKey: "AIzaSyA7vVpXOYxd3EkRdIHKfCDgcDRPq13oVwo",
  authDomain: "dulces-placeres-pedidos.firebaseapp.com",
  projectId: "dulces-placeres-pedidos",
  storageBucket: "dulces-placeres-pedidos.firebasestorage.app",
  messagingSenderId: "534587883303",
  appId: "1:534587883303:web:95800e583a196071b6f302"
});
const db = firebase.firestore();

let pedidos = [];
let waTarget = null;
const MESES = ['','enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const SHEETS_URL = 'https://script.google.com/macros/s/AKfycbwXQeCF6XdGT73uqbJkNvhVXeoQGIip763p9N8wEEpAE3-F97HRwSLFN6HqSL0IvZeQ/exec';

// Listener en tiempo real
document.getElementById('debug-bar').textContent = '✅ Firebase conectado — escuchando pedidos...';
db.collection('pedidos').orderBy('creado','desc').onSnapshot(snap => {
  pedidos = snap.docs.map(d => ({...d.data(), _fid: d.id}));
  const active = document.querySelector('.tab.active');
  if(active){
    const fn = active.getAttribute('onclick')||'';
    if(fn.includes('produccion')) renderProduccion();
    if(fn.includes('registro')) renderRegistro();
  }
}, err => {
  console.error('Listener error:', err);
  document.getElementById('debug-bar').style.background='#EF7C8E';
  document.getElementById('debug-bar').textContent = '❌ Error Firebase: ' + err.message;
});

// ==================== CATÁLOGO ====================
const PRODUCTOS_DEFAULT = [
  'Torta Chilena 8 porciones','Torta chilena de 6 porciones',
  'Pastel Vainilla Chips y Dulce de Leche 10 porciones',
  'Pastel Limon Cremoso y Dulce de leche 10 porciones',
  'Pastel Vainilla y Cheescake Fresa 10 porciones',
  'Pastel Chocolate y dulce de leche 10 porciones',
  'Pastel de Chocolate','Queque de Banano 2 Libras',
  'Rollos de Canela','Cheescake Fresa','Dulce de Leche',
  'Leche Cond Tradicional DP','Leche Cond Sabor Fresa DP',
  'Leche Cond Sabor Chocolate DP','Litro Leche Cond Tradicional',
  '1/2 Litro Leche Cond Tradicional','Mermelada Piña Maracuya'
];
function getCatalogo(){
  const s = localStorage.getItem('dp_catalogo');
  if(s) return JSON.parse(s);
  localStorage.setItem('dp_catalogo', JSON.stringify(PRODUCTOS_DEFAULT));
  return PRODUCTOS_DEFAULT;
}
function saveCatalogo(l){ localStorage.setItem('dp_catalogo', JSON.stringify(l)); }
function agregarProductoCatalogo(){
  const inp = document.getElementById('nuevo-producto');
  const n = inp.value.trim();
  if(!n){ alert('Escribí el nombre del producto'); return; }
  const c = getCatalogo();
  if(c.includes(n)){ alert('Ya existe'); return; }
  c.push(n); saveCatalogo(c); inp.value = '';
  renderCatalogo();
}
function eliminarProductoCatalogo(n){
  if(!confirm('¿Eliminar "'+n+'"?')) return;
  saveCatalogo(getCatalogo().filter(p=>p!==n));
  renderCatalogo();
}
function renderCatalogo(){
  const c = getCatalogo();
  document.getElementById('catalogo-lista').innerHTML = c.map(p=>`
    <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:#fff;border:1px solid #f0dde0;border-radius:8px;margin-bottom:6px">
      <span style="font-size:13px">${p}</span>
      <button class="btn-icon" onclick="eliminarProductoCatalogo('${p.replace(/'/g,\"\\'\")}')" ><i class="ti ti-trash"></i></button>
    </div>`).join('');
}

// ==================== FORMULARIO ====================
let numP = 0;
function addProducto(nombre='', cant=1, precio=''){
  const id = 'p'+numP++;
  const cat = getCatalogo();
  const div = document.createElement('div');
  div.className = 'product-row'; div.id = id;
  div.innerHTML = `
    <div>
      <label>Producto</label>
      <select onchange="updateTotal();checkOtro('${id}',this)">
        ${cat.map(p=>`<option value="${p}"${p===nombre?' selected':''}>${p}</option>`).join('')}
        <option value="Otro"${nombre==='Otro'?' selected':''}>Otro</option>
      </select>
      <input type="text" placeholder="Nombre del producto" class="otro-input" style="display:none;margin-top:6px">
    </div>
    <div><label>Cant.</label><input type="number" value="${cant}" min="1" oninput="updateTotal()" class="cant-i"></div>
    <div><label>Precio (₡)</label><input type="number" value="${precio}" placeholder="0" oninput="updateTotal()" class="precio-i"></div>
    <button class="btn-icon" onclick="document.getElementById('${id}').remove();updateTotal()" style="margin-top:18px"><i class="ti ti-trash"></i></button>
  `;
  document.getElementById('productos-container').appendChild(div);
  if(nombre==='Otro'){ const s=div.querySelector('select'); checkOtro(id,s); }
}
function checkOtro(id,sel){
  document.getElementById(id).querySelector('.otro-input').style.display = sel.value==='Otro'?'block':'none';
}
function getProductos(){
  return Array.from(document.querySelectorAll('#productos-container .product-row')).map(r=>{
    const sel=r.querySelector('select');
    const nombre=sel.value==='Otro'?r.querySelector('.otro-input').value||'Otro':sel.value;
    const cant=parseInt(r.querySelector('.cant-i').value)||1;
    const precio=parseFloat(r.querySelector('.precio-i').value)||0;
    return{nombre,cant,precio,total:cant*precio,entregado:false};
  });
}
function toggleEnvio(){
  const check=document.getElementById('f-envio-check').checked;
  document.getElementById('envio-precio-wrap').style.display=check?'flex':'none';
  if(!check) document.getElementById('f-envio-precio').value='';
  updateTotal();
}
function getEnvio(){
  return document.getElementById('f-envio-check').checked ? (parseFloat(document.getElementById('f-envio-precio').value)||0) : 0;
}
function updateTotal(){
  const sub=getProductos().reduce((s,p)=>s+p.total,0);
  const env=getEnvio();
  const total=sub+env;
  document.getElementById('total-display').textContent='₡'+total.toLocaleString('es-CR');
  const des=document.getElementById('envio-desglose');
  if(env>0){ des.style.display='block'; des.textContent=`Productos ₡${sub.toLocaleString('es-CR')} + Envío ₡${env.toLocaleString('es-CR')}`; }
  else des.style.display='none';
  calcSaldo();
}
function calcSaldo(){
  const sub=getProductos().reduce((s,p)=>s+p.total,0);
  const env=getEnvio();
  const total=sub+env;
  const pag=parseFloat(document.getElementById('f-pagado').value)||0;
  const s=total-pag;
  document.getElementById('f-saldo').value=s>0?'₡'+s.toLocaleString('es-CR'):'₡0';
}
function getMes(f){ if(!f)return''; const m=parseInt(f.split('-')[1]); return MESES[m]||''; }
function getSem(f){
  if(!f)return'';
  const d=new Date(f+'T12:00:00');
  const s=new Date(d.getFullYear(),0,1);
  return Math.ceil(((d-s)/86400000+s.getDay()+1)/7);
}
function formatFecha(f){
  if(!f)return'';
  const p=f.split('-');
  return p.length===3?p[2]+'/'+p[1]+'/'+p[0]:f;
}

// ==================== GUARDAR PEDIDO ====================
function guardarPedido(){
  const nombre = document.getElementById('f-nombre').value.trim();
  if(!nombre){ alert('Ingresa el nombre de la clienta'); return; }
  const prods = getProductos();
  if(!prods.length){ alert('Agrega al menos un producto'); return; }
  const sinPrecio = prods.find(p=>p.precio===0);
  if(sinPrecio){ alert('El precio de "'+sinPrecio.nombre+'" es 0. Ingresá el precio.'); return; }

  const btn = document.getElementById('btn-guardar');
  btn.disabled = true;
  btn.textContent = 'Guardando...';

  const fecha = document.getElementById('f-fecha').value;
  const sub = prods.reduce((s,p)=>s+p.total,0);
  const env = getEnvio();
  const total = sub+env;
  const pagado = parseFloat(document.getElementById('f-pagado').value)||0;

  const pedido = {
    fecha, zona: document.getElementById('f-zona').value,
    dir: document.getElementById('f-dir').value,
    semana: document.getElementById('f-semana').value || getSem(fecha),
    mes: getMes(fecha),
    nombre, tel: document.getElementById('f-tel').value,
    notas: document.getElementById('f-notas').value,
    productos: prods, subtotal: sub, envio: env,
    total, pagado, saldo: total-pagado,
    estado: 'pendiente', creado: new Date().toISOString()
  };

  db.collection('pedidos').add(pedido)
    .then(() => {
      enviarASheets(pedido);
      resetForm();
      btn.disabled = false;
      btn.innerHTML = '<i class="ti ti-device-floppy"></i> Guardar pedido';
      if(pedido.tel) abrirModalWA(pedido);
    })
    .catch(err => {
      console.error('Error Firebase:', err);
      alert('Error al guardar: '+err.message);
      btn.disabled = false;
      btn.innerHTML = '<i class="ti ti-device-floppy"></i> Guardar pedido';
    });
}

function resetForm(){
  ['f-nombre','f-tel','f-dir','f-fecha','f-semana','f-pagado','f-saldo','f-notas','f-envio-precio'].forEach(id=>{
    const el=document.getElementById(id); if(el) el.value='';
  });
  document.getElementById('f-zona').value='';
  document.getElementById('f-envio-check').checked=false;
  document.getElementById('envio-precio-wrap').style.display='none';
  document.getElementById('envio-desglose').style.display='none';
  document.getElementById('productos-container').innerHTML='';
  document.getElementById('total-display').textContent='₡0';
  numP=0; addProducto();
}

// ==================== WHATSAPP ====================
function generarMensaje(p){
  const lista=p.productos.map(pr=>`  • ${pr.cant}x ${pr.nombre} — ₡${pr.total.toLocaleString('es-CR')}`).join('\n');
  const envioL=p.envio>0?`\n🛵 Envío: ₡${p.envio.toLocaleString('es-CR')}` :'';
  const saldoL=p.saldo>0?`\n💳 Saldo pendiente: ₡${p.saldo.toLocaleString('es-CR')}` :'';
  return `Hola ${p.nombre} 🌸

Tu pedido de *Dulces Placeres* está listo para entregar 🎉

📦 *Detalle del pedido:*
${lista}${envioL}

💰 Total: ₡${p.total.toLocaleString('es-CR')}
✅ Pagado: ₡${(p.pagado||0).toLocaleString('es-CR')}${saldoL}
📅 Fecha de entrega: ${p.fecha||'Por confirmar'}
📍 Zona: ${p.zona||''} — ${p.dir||''}

Cualquier consulta, con gusto te atiendo. ¡Gracias por tu preferencia! 💕
— Dulces Placeres`;
}

function abrirModalWA(p){
  waTarget=p;
  document.getElementById('wa-msg').value=generarMensaje(p);
  document.getElementById('wa-modal').style.display='flex';
}
function cerrarModal(){
  document.getElementById('wa-modal').style.display='none';
  waTarget=null;
}
function limpiarTel(tel){
  let t=tel.replace(/[\s\-\(\)]/g,'');
  if(!t.startsWith('+')&&!t.startsWith('506')) t='506'+t;
  return t.replace('+','');
}
function enviarWA(){
  if(!waTarget) return;
  const msg=document.getElementById('wa-msg').value;
  const tel=limpiarTel(waTarget.tel);
  window.open(`https://wa.me/${tel}?text=${encodeURIComponent(msg)}`,'_blank');
  cerrarModal();
}

// ==================== GOOGLE SHEETS ====================
function enviarASheets(p){
  const rows=p.productos.map((pr,i)=>[
    formatFecha(p.fecha), p.semana||'', p.mes||'', p.zona||'',
    pr.nombre, pr.cant, pr.precio, pr.total,
    i===0?(p.envio||''):'', i===0?p.total:'',
    i===0?(p.pagado||''):'', i===0?(p.saldo||''):'',
    i===0?p.estado:''
  ]);
  fetch(SHEETS_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/json'},body:JSON.stringify({rows})})
    .catch(err=>console.error('Sheets error:',err));
}

// ==================== NAVEGACIÓN ====================
function showView(v,btn){
  document.querySelectorAll('.view').forEach(el=>el.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(el=>el.classList.remove('active'));
  document.getElementById('view-'+v).classList.add('active');
  btn.classList.add('active');
  if(v==='produccion') renderProduccion();
  if(v==='registro') renderRegistro();
  if(v==='config') renderCatalogo();
}

// ==================== PRODUCCIÓN ====================
function toggleProd(fid,idx){
  const p=pedidos.find(x=>x._fid===fid); if(!p) return;
  p.productos[idx].entregado=!p.productos[idx].entregado;
  const est=p.productos.every(pr=>pr.entregado)?'entregado':'pendiente';
  db.collection('pedidos').doc(fid).update({productos:p.productos,estado:est});
}
function marcarEntregado(fid){
  const p=pedidos.find(x=>x._fid===fid); if(!p) return;
  p.productos.forEach(pr=>pr.entregado=true);
  db.collection('pedidos').doc(fid).update({productos:p.productos,estado:'entregado'})
    .then(()=>{ if(p.tel) abrirModalWA(p); });
}
function marcarEstado(fid,est){
  const p=pedidos.find(x=>x._fid===fid); if(!p) return;
  p.productos.forEach(pr=>pr.entregado=est==='entregado');
  db.collection('pedidos').doc(fid).update({productos:p.productos,estado:est});
}
function eliminar(fid){
  if(!confirm('¿Eliminar este pedido?')) return;
  db.collection('pedidos').doc(fid).delete();
}
function limpiarFiltros(){
  document.getElementById('filtro-fecha').value='';
  document.getElementById('filtro-estado').value='';
  renderProduccion();
}
function renderProduccion(){
  const ff=document.getElementById('filtro-fecha').value;
  const fe=document.getElementById('filtro-estado').value;
  const lista=pedidos.filter(p=>{
    if(ff&&p.fecha!==ff) return false;
    if(fe&&p.estado!==fe) return false;
    return true;
  });
  const pend=pedidos.filter(p=>p.estado==='pendiente').length;
  const hoy=new Date().toISOString().split('T')[0];
  const hoyN=pedidos.filter(p=>p.fecha===hoy).length;
  const saldos=pedidos.filter(p=>p.saldo>0).length;
  document.getElementById('stats-bar').innerHTML=`
    <div class="stat"><div class="stat-val">${pend}</div><div class="stat-lbl">Pendientes</div></div>
    <div class="stat"><div class="stat-val">${hoyN}</div><div class="stat-lbl">Hoy</div></div>
    <div class="stat"><div class="stat-val">${saldos}</div><div class="stat-lbl">Con saldo</div></div>`;
  const cont=document.getElementById('produccion-lista');
  if(!lista.length){cont.innerHTML='<div class="empty">No hay pedidos</div>';return;}
  cont.innerHTML=lista.map(p=>`
    <div class="card ${p.estado==='entregado'?'done':''}">
      <div class="pedido-header">
        <div style="flex:1">
          <div class="pedido-nombre">${p.nombre}${p.saldo>0?`<span class="saldo-chip">Saldo ₡${p.saldo.toLocaleString('es-CR')}</span>`:''}</div>
          <div class="pedido-meta"><i class="ti ti-phone" style="font-size:12px"></i> ${p.tel||'—'} &nbsp;·&nbsp; <i class="ti ti-map-pin" style="font-size:12px"></i> ${p.zona||''} ${p.dir?'— '+p.dir:''} &nbsp;·&nbsp; <i class="ti ti-calendar" style="font-size:12px"></i> ${p.fecha||'Sin fecha'}</div>
          ${p.notas?`<div class="pedido-meta"><i class="ti ti-notes" style="font-size:12px"></i> ${p.notas}</div>`:''}
        </div>
        <span class="badge badge-${p.estado}">${p.estado}</span>
      </div>
      <div class="productos-lista">
        ${p.productos.map((pr,i)=>`
          <div class="prod-item ${pr.entregado?'entregado':''}">
            <div class="prod-row-inner">
              <button class="check-btn ${pr.entregado?'done':''}" onclick="toggleProd('${p._fid}',${i})">
                ${pr.entregado?'<i class="ti ti-check" style="font-size:13px;color:#fff"></i>':''}
              </button>
              <span class="prod-nombre">${pr.cant}x ${pr.nombre}</span>
            </div>
            <span class="prod-precio">₡${pr.total.toLocaleString('es-CR')}</span>
          </div>`).join('')}
      </div>
      <div class="pedido-footer">
        <span class="pedido-total">Total: <strong>₡${p.total.toLocaleString('es-CR')}</strong></span>
        <div style="display:flex;gap:6px;flex-wrap:wrap">
          ${p.estado==='entregado'
            ?`<button class="btn btn-sm" onclick="marcarEstado('${p._fid}','pendiente')">Reabrir</button>
               <button class="btn btn-sm btn-teal" onclick="abrirModalWA_id('${p._fid}')"><i class="ti ti-brand-whatsapp"></i> WA</button>`
            :`<button class="btn btn-sm btn-primary" onclick="marcarEntregado('${p._fid}')"><i class="ti ti-check"></i> Entregado + WA</button>`
          }
          <button class="btn btn-sm" style="color:#EF7C8E" onclick="eliminar('${p._fid}')"><i class="ti ti-trash"></i></button>
        </div>
      </div>
    </div>`).join('');
}
function abrirModalWA_id(fid){
  const p=pedidos.find(x=>x._fid===fid);
  if(p) abrirModalWA(p);
}

// ==================== REGISTRO ====================
function renderRegistro(){
  const buscar=(document.getElementById('buscar').value||'').toLowerCase();
  const mes=document.getElementById('filtro-mes').value;
  const lista=pedidos.filter(p=>{
    if(mes&&p.mes!==mes) return false;
    if(buscar&&!p.nombre.toLowerCase().includes(buscar)&&!p.productos.some(pr=>pr.nombre.toLowerCase().includes(buscar))) return false;
    return true;
  });
  const cont=document.getElementById('registro-lista');
  if(!lista.length){cont.innerHTML='<div class="empty">Sin resultados</div>';return;}
  cont.innerHTML=lista.map(p=>`
    <div class="card">
      <div class="pedido-header">
        <div>
          <div class="pedido-nombre">${p.nombre}</div>
          <div class="pedido-meta">${p.fecha||'Sin fecha'} &nbsp;·&nbsp; Sem. ${p.semana||'—'} &nbsp;·&nbsp; ${p.mes||'—'} &nbsp;·&nbsp; ${p.tel||'—'}</div>
          <div class="pedido-meta"><i class="ti ti-map-pin" style="font-size:12px"></i> ${p.zona||''} ${p.dir?'— '+p.dir:''}</div>
        </div>
        <div style="text-align:right">
          <span class="badge badge-${p.estado}">${p.estado}</span>
          ${p.saldo>0?`<div style="margin-top:5px"><span class="badge badge-saldo">Saldo ₡${p.saldo.toLocaleString('es-CR')}</span></div>`:''}
        </div>
      </div>
      <div class="productos-lista">
        ${p.productos.map(pr=>`
          <div class="prod-item">
            <span class="prod-nombre">${pr.cant}x ${pr.nombre}</span>
            <span class="prod-precio">₡${pr.precio.toLocaleString('es-CR')} c/u &nbsp;<strong>₡${pr.total.toLocaleString('es-CR')}</strong></span>
          </div>`).join('')}
      </div>
      <div class="pedido-footer">
        <span class="pedido-total">Pagado: <strong>₡${(p.pagado||0).toLocaleString('es-CR')}</strong> &nbsp;·&nbsp; Saldo: <strong style="color:${p.saldo>0?'#EF7C8E':'#769E94'}">₡${p.saldo.toLocaleString('es-CR')}</strong></span>
        <span class="pedido-total">Total: <strong>₡${p.total.toLocaleString('es-CR')}</strong></span>
      </div>
      ${p.notas?`<div style="font-size:12px;color:#bbb;margin-top:8px;padding-top:8px;border-top:1px solid #fceef0"><i class="ti ti-notes"></i> ${p.notas}</div>`:''}
    </div>`).join('');
}

// ==================== CORTES ====================
function preselecionarMes(){
  const mes=document.getElementById('c-mes').value; if(!mes) return;
  const MESES_NUM={enero:'01',febrero:'02',marzo:'03',abril:'04',mayo:'05',junio:'06',julio:'07',agosto:'08',septiembre:'09',octubre:'10',noviembre:'11',diciembre:'12'};
  const m=MESES_NUM[mes]; const y=new Date().getFullYear();
  const last=new Date(y,parseInt(m),0).getDate();
  document.getElementById('c-desde').value=`${y}-${m}-01`;
  document.getElementById('c-hasta').value=`${y}-${m}-${last}`;
}
function filtrarCorte(){
  const desde=document.getElementById('c-desde').value;
  const hasta=document.getElementById('c-hasta').value;
  const estado=document.getElementById('c-estado').value;
  return pedidos.filter(p=>{
    if(estado&&p.estado!==estado) return false;
    if(desde&&p.fecha&&p.fecha<desde) return false;
    if(hasta&&p.fecha&&p.fecha>hasta) return false;
    return true;
  });
}
function previsualizarCorte(){
  const lista=filtrarCorte();
  const cont=document.getElementById('corte-preview');
  if(!lista.length){cont.innerHTML='<div class="empty">No hay pedidos en ese período</div>';return;}
  const tTotal=lista.reduce((s,p)=>s+p.total,0);
  const tEnvio=lista.reduce((s,p)=>s+(p.envio||0),0);
  const tSaldo=lista.reduce((s,p)=>s+(p.saldo||0),0);
  const porProd={};
  lista.forEach(p=>p.productos.forEach(pr=>{
    if(!porProd[pr.nombre]) porProd[pr.nombre]={cant:0,total:0};
    porProd[pr.nombre].cant+=pr.cant; porProd[pr.nombre].total+=pr.total;
  }));
  cont.innerHTML=`
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:1.5rem">
      <div class="stat"><div class="stat-val">${lista.length}</div><div class="stat-lbl">Pedidos</div></div>
      <div class="stat"><div class="stat-val">₡${tTotal.toLocaleString('es-CR')}</div><div class="stat-lbl">Total ventas</div></div>
      <div class="stat"><div class="stat-val" style="color:#EF7C8E">₡${tSaldo.toLocaleString('es-CR')}</div><div class="stat-lbl">Saldos</div></div>
    </div>
    <p class="section-title">Por producto</p>
    <div class="card">
      <table style="width:100%;font-size:13px;border-collapse:collapse">
        <thead><tr style="border-bottom:1px solid #f0dde0">
          <th style="text-align:left;padding:6px 0;font-size:11px;color:#999;font-weight:600">Producto</th>
          <th style="text-align:center;padding:6px 0;font-size:11px;color:#999;font-weight:600">Cant.</th>
          <th style="text-align:right;padding:6px 0;font-size:11px;color:#999;font-weight:600">Total</th>
        </tr></thead>
        <tbody>${Object.entries(porProd).sort((a,b)=>b[1].total-a[1].total).map(([n,d])=>`
          <tr style="border-bottom:1px solid #fceef0">
            <td style="padding:7px 0">${n}</td>
            <td style="padding:7px 0;text-align:center;color:#888">${d.cant}</td>
            <td style="padding:7px 0;text-align:right;font-weight:600">₡${d.total.toLocaleString('es-CR')}</td>
          </tr>`).join('')}</tbody>
      </table>
    </div>`;
}
function exportarExcel(){
  const lista=filtrarCorte();
  if(!lista.length){alert('No hay pedidos en ese período');return;}
  const wb=XLSX.utils.book_new();
  const det=[['Fecha','Semana','Mes','Zona','Producto','Cantidad','Precio Unit.','Total Producto','Envío','Total Pedido','Pagado','Saldo','Estado','Notas']];
  lista.forEach(p=>p.productos.forEach((pr,i)=>det.push([
    p.fecha||'',p.semana||'',p.mes||'',p.zona||'',
    pr.nombre,pr.cant,pr.precio,pr.total,
    i===0?(p.envio||0):'',i===0?p.total:'',
    i===0?(p.pagado||0):'',i===0?(p.saldo||0):'',
    i===0?p.estado:'',i===0?(p.notas||''):''
  ])));
  const ws1=XLSX.utils.aoa_to_sheet(det);
  ws1['!cols']=[10,8,10,14,30,8,14,14,10,14,12,12,12,20].map(w=>(({wch:w})));
  XLSX.utils.book_append_sheet(wb,ws1,'Detalle pedidos');
  const desde=document.getElementById('c-desde').value||'inicio';
  const hasta=document.getElementById('c-hasta').value||'fin';
  XLSX.writeFile(wb,`Corte_DulcesPlaceres_${desde}_${hasta}.xlsx`);
}
