<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pedidos Dulces Placeres</title>
<meta name="application-name" content="Pedidos Dulces Placeres">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Dulces Placeres">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#EF7C8E">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#fdf6f7;color:#1a1a1a;font-size:14px}
.app{max-width:820px;margin:0 auto;padding:1.5rem 1rem}
h1{font-size:20px;font-weight:600;margin-bottom:4px;color:#1a1a1a}
.subtitle{font-size:13px;color:#999;margin-bottom:1.5rem}
.nav{display:flex;gap:8px;margin-bottom:1.5rem;border-bottom:1px solid #f0dde0;padding-bottom:1rem}
.tab{background:transparent;border:1px solid #e8cdd0;border-radius:8px;padding:8px 18px;font-size:13px;cursor:pointer;color:#999;transition:all .15s}
.tab.active{background:#EF7C8E;color:#fff;border-color:#EF7C8E;font-weight:500}
.tab:not(.active):hover{background:#fdeef0;border-color:#EF7C8E;color:#EF7C8E}
.view{display:none}.view.active{display:block}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.form-grid.full{grid-template-columns:1fr}
label{font-size:11px;color:#999;display:block;margin-bottom:4px;text-transform:uppercase;letter-spacing:.04em}
input,select,textarea{width:100%;font-size:13px;padding:9px 11px;border:1px solid #e8dde0;border-radius:8px;background:#fff;color:#1a1a1a;outline:none;transition:border .15s}
input:focus,select:focus,textarea:focus{border-color:#EF7C8E}
textarea{resize:vertical;min-height:60px}
.section-title{font-size:11px;font-weight:600;color:#ccc;margin:1.25rem 0 8px;text-transform:uppercase;letter-spacing:.06em}
.product-row{display:grid;grid-template-columns:2fr 70px 110px 32px;gap:8px;align-items:end;margin-bottom:8px}
.btn{border:1px solid #e0d5d8;background:#fff;border-radius:8px;padding:9px 16px;font-size:13px;cursor:pointer;color:#555;transition:all .12s}
.btn:hover{background:#fdeef0;border-color:#EF7C8E;color:#EF7C8E}
.btn-primary{background:#EF7C8E;color:#fff;border-color:#EF7C8E;font-weight:500}
.btn-primary:hover{background:#e86070;border-color:#e86070}
.btn-teal{background:#769E94;color:#fff;border-color:#769E94;font-weight:500}
.btn-teal:hover{background:#628880;border-color:#628880}
.btn-sm{padding:6px 12px;font-size:12px}
.btn-icon{width:32px;height:32px;padding:0;display:flex;align-items:center;justify-content:center;border-radius:8px;border:1px solid #e8dde0;background:#fff;cursor:pointer;color:#bbb}
.btn-icon:hover{background:#fff0f0;color:#EF7C8E;border-color:#EF7C8E}
.total-bar{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;background:#fff;border:1px solid #f0dde0;border-radius:10px;margin:1rem 0}
.total-bar span{font-size:13px;color:#999}
.total-bar strong{font-size:20px;font-weight:600;color:#EF7C8E}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:1.25rem}
.card{background:#fff;border:1px solid #f0dde0;border-radius:12px;padding:1rem 1.25rem;margin-bottom:12px}
.card.done{opacity:.5}
.pedido-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
.pedido-nombre{font-size:15px;font-weight:600;color:#1a1a1a}
.pedido-meta{font-size:12px;color:#aaa;margin-top:3px;line-height:1.8}
.badge{display:inline-block;font-size:11px;padding:3px 10px;border-radius:6px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.badge-pendiente{background:#fff3e0;color:#e67e22}
.badge-entregado{background:#eaf3f1;color:#769E94}
.badge-saldo{background:#fdeef0;color:#EF7C8E}
.productos-lista{border-top:1px solid #fceef0;padding-top:10px;margin-top:10px}
.prod-item{display:flex;justify-content:space-between;align-items:center;padding:6px 0;font-size:13px}
.prod-item.entregado .prod-nombre{text-decoration:line-through;color:#ccc}
.prod-nombre{color:#1a1a1a}
.prod-precio{color:#aaa;font-size:12px}
.check-btn{width:24px;height:24px;border-radius:50%;border:1.5px solid #e0d5d8;background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-right:10px;transition:all .15s;color:#fff}
.check-btn.done{background:#769E94;border-color:#769E94}
.prod-row-inner{display:flex;align-items:center;flex:1}
.pedido-footer{display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding-top:10px;border-top:1px solid #fceef0}
.pedido-total{font-size:13px;color:#aaa}
.pedido-total strong{color:#1a1a1a;font-weight:600}
.filtros{display:flex;gap:8px;margin-bottom:1rem;align-items:center;flex-wrap:wrap}
.filtros select,.filtros input{max-width:200px}
.empty{text-align:center;padding:3rem 1rem;color:#ccc;font-size:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:1.5rem}
.stat{background:#fff;border:1px solid #f0dde0;border-radius:10px;padding:1rem;text-align:center}
.stat-val{font-size:26px;font-weight:600;color:#EF7C8E}
.stat-lbl{font-size:11px;color:#bbb;margin-top:3px;text-transform:uppercase;letter-spacing:.04em}
.saldo-chip{font-size:11px;padding:2px 8px;border-radius:6px;background:#fdeef0;color:#EF7C8E;font-weight:500;margin-left:6px}

/* Modal WhatsApp */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;z-index:999;padding:1rem}
.modal{background:#fff;border-radius:14px;padding:1.5rem;width:100%;max-width:520px;box-shadow:0 8px 32px rgba(0,0,0,.12)}
.modal h3{font-size:16px;font-weight:600;margin-bottom:4px;color:#1a1a1a}
.modal p{font-size:12px;color:#aaa;margin-bottom:1rem}
.modal textarea{min-height:180px;font-size:13px;line-height:1.6;border-color:#e8dde0}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:1rem}
.wa-btn{background:#25D366;color:#fff;border:none;border-radius:8px;padding:9px 18px;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px}
.wa-btn:hover{background:#1ebe5a}
</style>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyA7vVpXOYxd3EkRdIHKfCDgcDRPq13oVwo",
    authDomain: "dulces-placeres-pedidos.firebaseapp.com",
    projectId: "dulces-placeres-pedidos",
    storageBucket: "dulces-placeres-pedidos.firebasestorage.app",
    messagingSenderId: "534587883303",
    appId: "1:534587883303:web:95800e583a196071b6f302"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  // Real-time listener — arranca cuando carga la página
  db.collection('pedidos').orderBy('creado','desc').onSnapshot(snapshot => {
    pedidos = snapshot.docs.map(d => ({ ...d.data(), _firebaseId: d.id }));
    const active = document.querySelector('.tab.active');
    if(active){
      const fn = active.getAttribute('onclick')||'';
      if(fn.includes('produccion')) renderProduccion();
      else if(fn.includes('registro')) renderRegistro();
    }
  }, err => console.error('Firebase listener error:', err));
</script>

  <!-- CONFIGURACIÓN -->
  <div id="view-config" class="view">
    <p class="section-title">Gestión de productos</p>
    <div class="card" style="margin-bottom:1rem">
      <div style="display:flex;gap:8px;align-items:flex-end">
        <div style="flex:1"><label>Nombre del producto</label><input type="text" id="nuevo-producto" placeholder="Ej: Cheesecake Maracuyá"></div>
        <button class="btn btn-primary" onclick="agregarProductoCatalogo()" style="flex-shrink:0">Agregar</button>
      </div>
    </div>
    <div id="catalogo-lista"></div>
  </div>

  <!-- CORTES -->
  <div id="view-cortes" class="view">
    <p class="section-title">Período del corte</p>
    <div class="form-grid">
      <div><label>Fecha desde</label><input type="date" id="c-desde"></div>
      <div><label>Fecha hasta</label><input type="date" id="c-hasta"></div>
    </div>
    <div class="form-grid">
      <div>
        <label>O filtrar por mes</label>
        <select id="c-mes" onchange="preselecionarMes()">
          <option value="">— Elegir mes —</option>
          <option>enero</option><option>febrero</option><option>marzo</option>
          <option>abril</option><option>mayo</option><option>junio</option>
          <option>julio</option><option>agosto</option><option>septiembre</option>
          <option>octubre</option><option>noviembre</option><option>diciembre</option>
        </select>
      </div>
      <div>
        <label>Estado</label>
        <select id="c-estado">
          <option value="">Todos</option>
          <option value="entregado">Solo entregados</option>
          <option value="pendiente">Solo pendientes</option>
        </select>
      </div>
    </div>
    <div style="display:flex;gap:8px;margin-top:8px;align-items:center">
      <button class="btn btn-primary" onclick="previsualizarCorte()"><i class="ti ti-eye"></i> Previsualizar</button>
      <button class="btn btn-teal" onclick="exportarExcel()"><i class="ti ti-file-spreadsheet"></i> Descargar Excel</button>
    </div>
    <div id="corte-preview" style="margin-top:1.5rem"></div>
  </div>

  <!-- NUEVO PEDIDO -->
  <div id="view-nuevo" class="view active">
    <p class="section-title">Datos de la clienta</p>
    <div class="form-grid">
      <div><label>Nombre</label><input type="text" id="f-nombre" placeholder="Ej: María González"></div>
      <div><label>Teléfono</label><input type="text" id="f-tel" placeholder="8888-0000"></div>
    </div>
    <div class="form-grid full">
      <div><label>Dirección / zona de entrega</label><input type="text" id="f-dir" placeholder="Ej: San José, Sabana Norte"></div>
    </div>
    <div class="form-grid">
      <div><label>Fecha de entrega</label><input type="date" id="f-fecha"></div>
      <div><label>Semana #</label><input type="number" id="f-semana" placeholder="Ej: 23" min="1" max="53"></div>
    </div>

    <p class="section-title">Productos</p>
    <div id="productos-container"></div>
    <button class="btn btn-sm" onclick="addProducto()"><i class="ti ti-plus"></i> Agregar producto</button>

    <div style="display:flex;align-items:center;gap:10px;margin:1rem 0 8px;padding:12px 14px;background:#fff;border:1px solid #f0dde0;border-radius:10px">
      <input type="checkbox" id="f-envio-check" onchange="toggleEnvio()" style="width:18px;height:18px;accent-color:#EF7C8E;cursor:pointer;flex-shrink:0">
      <label for="f-envio-check" style="font-size:13px;color:#555;text-transform:none;letter-spacing:0;margin:0;cursor:pointer;flex:1">Incluir envío</label>
      <div id="envio-precio-wrap" style="display:none;align-items:center;gap:8px">
        <label style="font-size:11px;color:#999;text-transform:uppercase;letter-spacing:.04em;margin:0;white-space:nowrap">Costo envío (₡)</label>
        <input type="number" id="f-envio-precio" placeholder="0" oninput="updateTotal()" style="width:120px;margin:0">
      </div>
    </div>

    <div class="total-bar">
      <div>
        <span>Total del pedido</span>
        <div id="envio-desglose" style="font-size:11px;color:#bbb;margin-top:2px;display:none"></div>
      </div>
      <strong id="total-display">₡0</strong>
    </div>

    <p class="section-title">Pago</p>
    <div class="form-grid">
      <div><label>Monto recibido (₡)</label><input type="number" id="f-pagado" placeholder="0" oninput="calcSaldo()"></div>
      <div><label>Saldo pendiente</label><input type="text" id="f-saldo" readonly style="color:#EF7C8E;font-weight:600"></div>
    </div>
    <div class="form-grid full">
      <div><label>Notas adicionales</label><textarea id="f-notas" placeholder="Alergias, instrucciones especiales, ruta de entrega..."></textarea></div>
    </div>

    <div class="actions">
      <button class="btn" onclick="resetForm()">Limpiar</button>
      <button class="btn btn-primary" onclick="guardarPedido()"><i class="ti ti-device-floppy"></i> Guardar pedido</button>
    </div>
  </div>

  <!-- PRODUCCIÓN -->
  <div id="view-produccion" class="view">
    <div class="stats" id="stats-bar"></div>
    <div class="filtros">
      <input type="date" id="filtro-fecha" onchange="renderProduccion()">
      <select id="filtro-estado" onchange="renderProduccion()">
        <option value="">Todos los estados</option>
        <option value="pendiente">Pendientes</option>
        <option value="entregado">Entregados</option>
      </select>
      <button class="btn btn-sm" onclick="limpiarFiltros()">Limpiar filtros</button>
    </div>
    <div id="produccion-lista"></div>
  </div>

  <!-- REGISTRO -->
  <div id="view-registro" class="view">
    <div class="filtros">
      <input type="text" id="buscar" placeholder="Buscar clienta o producto..." oninput="renderRegistro()" style="max-width:280px">
      <select id="filtro-mes" onchange="renderRegistro()">
        <option value="">Todos los meses</option>
        <option>enero</option><option>febrero</option><option>marzo</option>
        <option>abril</option><option>mayo</option><option>junio</option>
        <option>julio</option><option>agosto</option><option>septiembre</option>
        <option>octubre</option><option>noviembre</option><option>diciembre</option>
      </select>
    </div>
    <div id="registro-lista"></div>
  </div>
</div>

    <textarea id="wa-msg"></textarea>
    <div class="modal-actions">
      <button class="btn btn-sm" onclick="cerrarModal()">Cancelar</button>
      <button class="btn btn-sm btn-teal" onclick="enviarDirecto()"><i class="ti ti-send"></i> Enviar directo</button>
      <button class="wa-btn" onclick="enviarEditado()"><i class="ti ti-brand-whatsapp"></i> Abrir en WhatsApp</button>
    </div>
  </div>
</div>

<script>
let pedidos = []; // managed by Firebase real-time listener
let waTarget = null; // {tel, msg}

// Catálogo manejado dinámicamente via getCatalogo()
const MESES=['','enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
let numP=0;

function save(){
  // pedidos array is now managed by Firebase snapshot listener
  // localStorage kept only as fallback
}

async async function fbGuardar(pedido){
  const docRef = await db.collection('pedidos').add(pedido);
  return docRef.id;
}

async function fbActualizar(firebaseId, datos){
  if(!firebaseId) return;
  try {
    await db.collection('pedidos').doc(firebaseId).update(datos);
  } catch(e){ console.error('Firebase update error:', e); }
}

async function fbEliminar(firebaseId){
  if(!firebaseId) return;
  try {
    await db.collection('pedidos').doc(firebaseId).delete();
  } catch(e){ console.error('Firebase delete error:', e); }
}

function showView(v,btn){
  document.querySelectorAll('.view').forEach(el=>el.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(el=>el.classList.remove('active'));
  document.getElementById('view-'+v).classList.add('active');
  btn.classList.add('active');
  if(v==='produccion')renderProduccion();
  if(v==='registro')renderRegistro();
}

function addProducto(nombre='',cant=1,precio=''){
  const id='p'+numP++;
  const div=document.createElement('div');
  div.className='product-row';div.id=id;
  const catalogoActual = getCatalogo();
  div.innerHTML=`
    <div>
      <label>Producto</label>
      <select onchange="updateTotal();checkOtro('${id}',this)">
        ${catalogoActual.map(p=>`<option value="${p}"${p===nombre?' selected':''}>${p}</option>`).join('')}
        <option value="Otro"${nombre==='Otro'?' selected':''}>Otro</option>
      </select>
      <input type="text" placeholder="Nombre del producto" class="otro-input" style="display:none;margin-top:6px">
    </div>
    <div><label>Cant.</label><input type="number" value="${cant}" min="1" oninput="updateTotal()" class="cant-i"></div>
    <div><label>Precio (₡)</label><input type="number" value="${precio}" placeholder="0" oninput="updateTotal()" class="precio-i"></div>
    <button class="btn-icon" onclick="document.getElementById('${id}').remove();updateTotal()" style="margin-top:18px" title="Eliminar"><i class="ti ti-trash"></i></button>
  `;
  document.getElementById('productos-container').appendChild(div);
  if(nombre==='Otro'){const s=div.querySelector('select');checkOtro(id,s)}
}

function checkOtro(id,sel){
  const inp=document.getElementById(id).querySelector('.otro-input');
  inp.style.display=sel.value==='Otro'?'block':'none';
}

function getProductos(){
  return Array.from(document.querySelectorAll('#productos-container .product-row')).map(r=>{
    const sel=r.querySelector('select');
    const nombre=sel.value==='Otro'?r.querySelector('.otro-input').value||'Otro':sel.value;
    const cant=parseInt(r.querySelector('.cant-i').value)||1;
    const precio=parseFloat(r.querySelector('.precio-i').value)||0;
    return{nombre,cant,precio,total:cant*precio,entregado:false};
  });
}

function toggleEnvio(){
  const check=document.getElementById('f-envio-check').checked;
  const wrap=document.getElementById('envio-precio-wrap');
  wrap.style.display=check?'flex':'none';
  if(!check)document.getElementById('f-envio-precio').value='';
  updateTotal();
}

function getEnvio(){
  const check=document.getElementById('f-envio-check').checked;
  if(!check)return 0;
  return parseFloat(document.getElementById('f-envio-precio').value)||0;
}

function updateTotal(){
  const subtotal=getProductos().reduce((s,p)=>s+p.total,0);
  const envio=getEnvio();
  const total=subtotal+envio;
  document.getElementById('total-display').textContent='₡'+total.toLocaleString('es-CR');
  const desglose=document.getElementById('envio-desglose');
  if(envio>0){
    desglose.style.display='block';
    desglose.textContent=`Productos ₡${subtotal.toLocaleString('es-CR')} + Envío ₡${envio.toLocaleString('es-CR')}`;
  } else {
    desglose.style.display='none';
  }
  calcSaldo();
}

function calcSaldo(){
  const subtotal=getProductos().reduce((s,p)=>s+p.total,0);
  const envio=getEnvio();
  const total=subtotal+envio;
  const pag=parseFloat(document.getElementById('f-pagado').value)||0;
  const s=total-pag;
  document.getElementById('f-saldo').value=s>0?'₡'+s.toLocaleString('es-CR'):'₡0';
}

function getMes(f){if(!f)return'';const m=parseInt(f.split('-')[1]);return MESES[m]||'';}
function getSem(f){
  if(!f)return'';
  const d=new Date(f+'T12:00:00');
  const s=new Date(d.getFullYear(),0,1);
  return Math.ceil(((d-s)/86400000+s.getDay()+1)/7);
}

function guardarPedido(){
  const nombre=document.getElementById('f-nombre').value.trim();
  if(!nombre){alert('Ingresa el nombre de la clienta');return}
  const prods=getProductos();
  if(!prods.length||prods[0].precio===0){alert('Agrega al menos un producto con precio');return}
  const fecha=document.getElementById('f-fecha').value;
  const subtotal=prods.reduce((s,p)=>s+p.total,0);
  const envio=getEnvio();
  const total=subtotal+envio;
  const pagado=parseFloat(document.getElementById('f-pagado').value)||0;
  const nuevoPedido = {
    id:Date.now(),fecha,
    semana:document.getElementById('f-semana').value||getSem(fecha),
    mes:getMes(fecha),nombre,
    tel:document.getElementById('f-tel').value,
    zona:document.getElementById('f-zona').value,
    dir:document.getElementById('f-dir').value,
    notas:document.getElementById('f-notas').value,
    productos:prods,subtotal,envio,total,pagado,saldo:total-pagado,
    estado:'pendiente',creado:new Date().toISOString()
  };
  // Save to Firebase (real-time sync) + Google Sheets (registro)
  fbGuardar(nuevoPedido).then(() => {
    enviarASheets(nuevoPedido);
    resetForm();
    // Abrir WhatsApp de confirmación si tiene teléfono
    if(nuevoPedido.tel){
      abrirModalWA_directo(nuevoPedido);
    }
  }).catch((err) => {
    console.error('Error guardando:', err);
    alert('Error al guardar. Verificá tu conexión a internet.');
  });
}

function resetForm(){
  ['f-nombre','f-tel','f-zona','f-dir','f-fecha','f-semana','f-pagado','f-saldo','f-notas','f-envio-precio'].forEach(id=>{const el=document.getElementById(id); if(el) el.value='';});
  document.getElementById('f-envio-check').checked=false;
  document.getElementById('envio-precio-wrap').style.display='none';
  document.getElementById('envio-desglose').style.display='none';
  document.getElementById('productos-container').innerHTML='';
  document.getElementById('total-display').textContent='₡0';
  numP=0;addProducto();
}

function generarMensaje(p){
  const lista=p.productos.map(pr=>`  • ${pr.cant}x ${pr.nombre} — ₡${pr.total.toLocaleString('es-CR')}`).join('\n');
  const envioLinea=p.envio>0?`\n🛵 Envío: ₡${p.envio.toLocaleString('es-CR')}`:'';
  const saldoLinea=p.saldo>0?`\n💳 Saldo pendiente: ₡${p.saldo.toLocaleString('es-CR')}`:'';
  return `Hola ${p.nombre} 🌸

Tu pedido de *Dulces Placeres* está listo para entregar 🎉

📦 *Detalle del pedido:*
${lista}${envioLinea}

💰 Total: ₡${p.total.toLocaleString('es-CR')}
✅ Pagado: ₡${(p.pagado||0).toLocaleString('es-CR')}${saldoLinea}
📅 Fecha de entrega: ${p.fecha||'Por confirmar'}
📍 Zona: ${p.zona||'Por confirmar'} — ${p.dir||''}

Cualquier consulta, con gusto te atiendo. ¡Gracias por tu preferencia! 💕
— Dulces Placeres`;
}


function abrirModalWA_directo(p){
  if(!p.tel) return;
  waTarget = p;
  document.getElementById('wa-msg').value = generarMensaje(p);
  document.getElementById('wa-modal').style.display = 'flex';
}

function abrirModalWA(id){
  const p=pedidos.find(x=>x.id===id);if(!p)return;
  if(!p.tel){alert('Este pedido no tiene número de teléfono registrado.');return}
  waTarget=p;
  document.getElementById('wa-msg').value=generarMensaje(p);
  document.getElementById('wa-modal').style.display='flex';
}

function cerrarModal(){
  document.getElementById('wa-modal').style.display='none';
  waTarget=null;
}

function limpiarTel(tel){
  // limpia guiones, espacios, y agrega código de CR si no tiene
  let t=tel.replace(/[\s\-\(\)]/g,'');
  if(!t.startsWith('+')&&!t.startsWith('506'))t='506'+t;
  return t.replace('+','');
}

function enviarDirecto(){
  if(!waTarget)return;
  const msg=document.getElementById('wa-msg').value;
  const tel=limpiarTel(waTarget.tel);
  window.open(`https://wa.me/${tel}?text=${encodeURIComponent(msg)}`,'_blank');
  cerrarModal();
}

function enviarEditado(){
  enviarDirecto();
}

function toggleProd(pid,idx){
  const p=pedidos.find(x=>x.id===pid);if(!p)return;
  p.productos[idx].entregado=!p.productos[idx].entregado;
  p.estado=p.productos.every(pr=>pr.entregado)?'entregado':'pendiente';
  fbActualizar(p._firebaseId, {productos:p.productos, estado:p.estado});
}

function marcarEntregado(id){
  const p=pedidos.find(x=>x.id===id);if(!p)return;
  p.estado='entregado';
  p.productos.forEach(pr=>pr.entregado=true);
  fbActualizar(p._firebaseId, {productos:p.productos, estado:'entregado'});
  abrirModalWA(id);
}

function marcarEstado(id,est){
  const p=pedidos.find(x=>x.id===id);if(!p)return;
  p.estado=est;
  p.productos.forEach(pr=>pr.entregado=est==='entregado');
  fbActualizar(p._firebaseId, {productos:p.productos, estado:est});
}

function eliminar(id){
  if(!confirm('¿Eliminar este pedido?'))return;
  const p=pedidos.find(x=>x.id===id);
  if(p && p._firebaseId) fbEliminar(p._firebaseId);
}

function renderProduccion(){
  const ff=document.getElementById('filtro-fecha').value;
  const fe=document.getElementById('filtro-estado').value;
  const lista=pedidos.filter(p=>{
    if(ff&&p.fecha!==ff)return false;
    if(fe&&p.estado!==fe)return false;
    return true;
  });
  const pend=pedidos.filter(p=>p.estado==='pendiente').length;
  const hoy=new Date().toISOString().split('T')[0];
  const hoyN=pedidos.filter(p=>p.fecha===hoy).length;
  const saldos=pedidos.filter(p=>p.saldo>0).length;
  document.getElementById('stats-bar').innerHTML=`
    <div class="stat"><div class="stat-val">${pend}</div><div class="stat-lbl">Pendientes</div></div>
    <div class="stat"><div class="stat-val">${hoyN}</div><div class="stat-lbl">Entregas hoy</div></div>
    <div class="stat"><div class="stat-val">${saldos}</div><div class="stat-lbl">Con saldo</div></div>
  `;
  const cont=document.getElementById('produccion-lista');
  if(!lista.length){cont.innerHTML='<div class="empty"><i class="ti ti-clipboard-off" style="font-size:36px;display:block;margin-bottom:8px"></i>No hay pedidos con estos filtros</div>';return}
  cont.innerHTML=lista.map(p=>`
    <div class="card ${p.estado==='entregado'?'done':''}">
      <div class="pedido-header">
        <div style="flex:1">
          <div class="pedido-nombre">${p.nombre}${p.saldo>0?`<span class="saldo-chip">Saldo ₡${p.saldo.toLocaleString('es-CR')}</span>`:''}</div>
          <div class="pedido-meta">
            <i class="ti ti-phone" style="font-size:12px"></i> ${p.tel||'—'} &nbsp;·&nbsp;
            <i class="ti ti-map-pin" style="font-size:12px"></i> ${p.zona||''} ${p.dir?'— '+p.dir:''} &nbsp;·&nbsp;
            <i class="ti ti-calendar" style="font-size:12px"></i> ${p.fecha||'Sin fecha'}
          </div>
          ${p.notas?`<div class="pedido-meta"><i class="ti ti-notes" style="font-size:12px"></i> ${p.notas}</div>`:''}
        </div>
        <span class="badge badge-${p.estado}">${p.estado}</span>
      </div>
      <div class="productos-lista">
        ${p.productos.map((pr,i)=>`
          <div class="prod-item ${pr.entregado?'entregado':''}">
            <div class="prod-row-inner">
              <button class="check-btn ${pr.entregado?'done':''}" onclick="toggleProd(${p.id},${i})" title="${pr.entregado?'Pendiente':'Marcar entregado'}">
                ${pr.entregado?'<i class="ti ti-check" style="font-size:13px;color:#fff"></i>':''}
              </button>
              <span class="prod-nombre">${pr.cant}x ${pr.nombre}</span>
            </div>
            <span class="prod-precio">₡${pr.total.toLocaleString('es-CR')}</span>
          </div>
        `).join('')}
      </div>
      <div class="pedido-footer">
        <span class="pedido-total">Total: <strong>₡${p.total.toLocaleString('es-CR')}</strong></span>
        <div style="display:flex;gap:6px;flex-wrap:wrap">
          ${p.estado==='entregado'
            ?`<button class="btn btn-sm" onclick="marcarEstado(${p.id},'pendiente')">Reabrir</button>
               <button class="btn btn-sm btn-teal" onclick="abrirModalWA(${p.id})"><i class="ti ti-brand-whatsapp"></i> Enviar WA</button>`
            :`<button class="btn btn-sm btn-primary" onclick="marcarEntregado(${p.id})"><i class="ti ti-check"></i> Entregado + WA</button>`
          }
          <button class="btn btn-sm" style="color:#EF7C8E;border-color:#f0c0c8" onclick="eliminar(${p.id})"><i class="ti ti-trash"></i></button>
        </div>
      </div>
    </div>
  `).join('');
}

function limpiarFiltros(){
  document.getElementById('filtro-fecha').value='';
  document.getElementById('filtro-estado').value='';
  renderProduccion();
}

function renderRegistro(){
  const buscar=(document.getElementById('buscar').value||'').toLowerCase();
  const mes=document.getElementById('filtro-mes').value;
  const lista=pedidos.filter(p=>{
    if(mes&&p.mes!==mes)return false;
    if(buscar&&!p.nombre.toLowerCase().includes(buscar)&&!p.productos.some(pr=>pr.nombre.toLowerCase().includes(buscar)))return false;
    return true;
  });
  const cont=document.getElementById('registro-lista');
  if(!lista.length){cont.innerHTML='<div class="empty"><i class="ti ti-table-off" style="font-size:36px;display:block;margin-bottom:8px"></i>Sin resultados</div>';return}
  cont.innerHTML=lista.map(p=>`
    <div class="card">
      <div class="pedido-header">
        <div>
          <div class="pedido-nombre">${p.nombre}</div>
          <div class="pedido-meta">
            ${p.fecha||'Sin fecha'} &nbsp;·&nbsp; Sem. ${p.semana||'—'} &nbsp;·&nbsp; ${p.mes||'—'}
            &nbsp;·&nbsp; <i class="ti ti-phone" style="font-size:12px"></i> ${p.tel||'—'}
          </div>
          <div class="pedido-meta"><i class="ti ti-map-pin" style="font-size:12px"></i> ${p.zona||''} ${p.dir?'— '+p.dir:''}</div>
        </div>
        <div style="text-align:right">
          <span class="badge badge-${p.estado}">${p.estado}</span>
          ${p.saldo>0?`<div style="margin-top:5px"><span class="badge badge-saldo">Saldo ₡${p.saldo.toLocaleString('es-CR')}</span></div>`:''}
        </div>
      </div>
      <div class="productos-lista">
        ${p.productos.map(pr=>`
          <div class="prod-item">
            <span class="prod-nombre">${pr.cant}x ${pr.nombre}</span>
            <span class="prod-precio">₡${pr.precio.toLocaleString('es-CR')} c/u &nbsp;<strong>₡${pr.total.toLocaleString('es-CR')}</strong></span>
          </div>
        `).join('')}
      </div>
      <div class="pedido-footer">
        <span class="pedido-total">Pagado: <strong>₡${(p.pagado||0).toLocaleString('es-CR')}</strong> &nbsp;·&nbsp; Saldo: <strong style="color:${p.saldo>0?'#EF7C8E':'#769E94'}">₡${p.saldo.toLocaleString('es-CR')}</strong></span>
        <span class="pedido-total">Total: <strong>₡${p.total.toLocaleString('es-CR')}</strong></span>
      </div>
      ${p.notas?`<div style="font-size:12px;color:#bbb;margin-top:8px;padding-top:8px;border-top:1px solid #fceef0"><i class="ti ti-notes"></i> ${p.notas}</div>`:''}
    </div>
  `).join('');
}


function preselecionarMes(){
  const mes = document.getElementById('c-mes').value;
  if(!mes) return;
  const year = new Date().getFullYear();
  const MESES_NUM = {enero:'01',febrero:'02',marzo:'03',abril:'04',mayo:'05',junio:'06',julio:'07',agosto:'08',septiembre:'09',octubre:'10',noviembre:'11',diciembre:'12'};
  const m = MESES_NUM[mes];
  const lastDay = new Date(year, parseInt(m), 0).getDate();
  document.getElementById('c-desde').value = `${year}-${m}-01`;
  document.getElementById('c-hasta').value = `${year}-${m}-${lastDay}`;
}

function filtrarPorCorte(){
  const desde = document.getElementById('c-desde').value;
  const hasta = document.getElementById('c-hasta').value;
  const estado = document.getElementById('c-estado').value;
  return pedidos.filter(p => {
    if(estado && p.estado !== estado) return false;
    if(desde && p.fecha && p.fecha < desde) return false;
    if(hasta && p.fecha && p.fecha > hasta) return false;
    return true;
  });
}

function previsualizarCorte(){
  const lista = filtrarPorCorte();
  const cont = document.getElementById('corte-preview');
  if(!lista.length){
    cont.innerHTML='<div class="empty"><i class="ti ti-table-off" style="font-size:32px;display:block;margin-bottom:8px"></i>No hay pedidos en ese período</div>';
    return;
  }
  const totalGeneral = lista.reduce((s,p)=>s+p.total,0);
  const totalEnvios = lista.reduce((s,p)=>s+(p.envio||0),0);
  const totalSaldos = lista.reduce((s,p)=>s+(p.saldo||0),0);
  const totalPagado = lista.reduce((s,p)=>s+(p.pagado||0),0);

  // Resumen por producto
  const porProducto = {};
  lista.forEach(p => {
    p.productos.forEach(pr => {
      if(!porProducto[pr.nombre]) porProducto[pr.nombre]={cant:0,total:0};
      porProducto[pr.nombre].cant += pr.cant;
      porProducto[pr.nombre].total += pr.total;
    });
  });

  cont.innerHTML = `
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:1.5rem">
      <div class="stat"><div class="stat-val">${lista.length}</div><div class="stat-lbl">Pedidos</div></div>
      <div class="stat"><div class="stat-val">₡${totalGeneral.toLocaleString('es-CR')}</div><div class="stat-lbl">Ventas totales</div></div>
      <div class="stat"><div class="stat-val">₡${totalEnvios.toLocaleString('es-CR')}</div><div class="stat-lbl">Total envíos</div></div>
      <div class="stat"><div class="stat-val" style="color:#EF7C8E">₡${totalSaldos.toLocaleString('es-CR')}</div><div class="stat-lbl">Saldos pendientes</div></div>
    </div>

    <p class="section-title">Resumen por producto</p>
    <div class="card" style="margin-bottom:1.5rem">
      <table style="width:100%;font-size:13px;border-collapse:collapse">
        <thead>
          <tr style="border-bottom:1px solid #f0dde0">
            <th style="text-align:left;padding:6px 0;font-size:11px;color:#999;font-weight:600;text-transform:uppercase">Producto</th>
            <th style="text-align:center;padding:6px 0;font-size:11px;color:#999;font-weight:600;text-transform:uppercase">Cant.</th>
            <th style="text-align:right;padding:6px 0;font-size:11px;color:#999;font-weight:600;text-transform:uppercase">Total</th>
          </tr>
        </thead>
        <tbody>
          ${Object.entries(porProducto).sort((a,b)=>b[1].total-a[1].total).map(([nom,d])=>`
            <tr style="border-bottom:1px solid #fceef0">
              <td style="padding:7px 0;color:#1a1a1a">${nom}</td>
              <td style="padding:7px 0;text-align:center;color:#888">${d.cant}</td>
              <td style="padding:7px 0;text-align:right;font-weight:600;color:#1a1a1a">₡${d.total.toLocaleString('es-CR')}</td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    </div>

    <p class="section-title">Detalle de pedidos (${lista.length})</p>
    ${lista.map(p=>`
      <div class="card" style="margin-bottom:8px">
        <div style="display:flex;justify-content:space-between;align-items:flex-start">
          <div>
            <div style="font-weight:600;font-size:14px">${p.nombre}</div>
            <div style="font-size:12px;color:#aaa;margin-top:2px">${p.fecha||'—'} · ${p.tel||'—'} · ${p.dir||'—'}</div>
            <div style="font-size:12px;color:#aaa;margin-top:2px">${p.productos.map(pr=>`${pr.cant}x ${pr.nombre}`).join(', ')}</div>
          </div>
          <div style="text-align:right;flex-shrink:0;margin-left:12px">
            <span class="badge badge-${p.estado}">${p.estado}</span>
            <div style="font-size:13px;font-weight:600;margin-top:4px">₡${p.total.toLocaleString('es-CR')}</div>
            ${p.saldo>0?`<div style="font-size:11px;color:#EF7C8E">Saldo ₡${p.saldo.toLocaleString('es-CR')}</div>`:''}
          </div>
        </div>
      </div>
    `).join('')}
  `;
}

function exportarExcel(){
  const lista = filtrarPorCorte();
  if(!lista.length){ alert('No hay pedidos en ese período'); return; }

  const wb = XLSX.utils.book_new();

  // ---- HOJA 1: Detalle de pedidos ----
  const detalle = [];
  detalle.push(['Fecha','Semana','Mes','Clienta','Teléfono','Dirección','Producto','Cantidad','Precio unitario','Total producto','Envío','Total pedido','Pagado','Saldo','Estado','Notas']);
  lista.forEach(p => {
    p.productos.forEach((pr, i) => {
      detalle.push([
        p.fecha||'',
        p.semana||'',
        p.mes||'',
        p.nombre||'',
        p.tel||'',
        p.dir||'',
        pr.nombre||'',
        pr.cant,
        pr.precio,
        pr.total,
        i===0 ? (p.envio||0) : '',
        i===0 ? p.total : '',
        i===0 ? (p.pagado||0) : '',
        i===0 ? (p.saldo||0) : '',
        i===0 ? p.estado : '',
        i===0 ? (p.notas||'') : ''
      ]);
    });
  });
  const ws1 = XLSX.utils.aoa_to_sheet(detalle);
  ws1['!cols'] = [10,8,10,20,14,22,30,8,14,14,10,14,12,12,12,20].map(w=>({wch:w}));
  XLSX.utils.book_append_sheet(wb, ws1, 'Detalle pedidos');

  // ---- HOJA 2: Resumen por producto ----
  const porProducto = {};
  lista.forEach(p => {
    p.productos.forEach(pr => {
      if(!porProducto[pr.nombre]) porProducto[pr.nombre]={cant:0,total:0};
      porProducto[pr.nombre].cant += pr.cant;
      porProducto[pr.nombre].total += pr.total;
    });
  });
  const resumen = [['Producto','Cantidad vendida','Total vendido']];
  Object.entries(porProducto).sort((a,b)=>b[1].total-a[1].total).forEach(([nom,d])=>{
    resumen.push([nom, d.cant, d.total]);
  });
  resumen.push(['','','']);
  resumen.push(['TOTAL GENERAL','', lista.reduce((s,p)=>s+p.total,0)]);
  resumen.push(['Total envíos','', lista.reduce((s,p)=>s+(p.envio||0),0)]);
  resumen.push(['Total cobrado','', lista.reduce((s,p)=>s+(p.pagado||0),0)]);
  resumen.push(['Saldos pendientes','', lista.reduce((s,p)=>s+(p.saldo||0),0)]);
  const ws2 = XLSX.utils.aoa_to_sheet(resumen);
  ws2['!cols'] = [{wch:35},{wch:18},{wch:18}];
  XLSX.utils.book_append_sheet(wb, ws2, 'Resumen productos');

  // ---- HOJA 3: Saldos pendientes ----
  const conSaldo = lista.filter(p=>p.saldo>0);
  const saldos = [['Clienta','Teléfono','Fecha entrega','Total pedido','Pagado','Saldo pendiente','Estado']];
  conSaldo.forEach(p => {
    saldos.push([p.nombre, p.tel||'', p.fecha||'', p.total, p.pagado||0, p.saldo, p.estado]);
  });
  if(conSaldo.length===0) saldos.push(['Sin saldos pendientes en este período','','','','','','']);
  const ws3 = XLSX.utils.aoa_to_sheet(saldos);
  ws3['!cols'] = [{wch:22},{wch:14},{wch:14},{wch:14},{wch:12},{wch:16},{wch:12}];
  XLSX.utils.book_append_sheet(wb, ws3, 'Saldos pendientes');

  const desde = document.getElementById('c-desde').value || 'inicio';
  const hasta = document.getElementById('c-hasta').value || 'fin';
  XLSX.writeFile(wb, `Corte_DulcesPlaceres_${desde}_${hasta}.xlsx`);
}


const SHEETS_URL = 'https://script.google.com/macros/s/AKfycbwXQeCF6XdGT73uqbJkNvhVXeoQGIip763p9N8wEEpAE3-F97HRwSLFN6HqSL0IvZeQ/exec';

function formatFecha(fecha){
  if(!fecha) return '';
  // Convert yyyy-mm-dd to dd/mm/yyyy
  const parts = fecha.split('-');
  if(parts.length===3) return parts[2]+'/'+parts[1]+'/'+parts[0];
  return fecha;
}

function enviarASheets(pedido){
  // Each product = one row, matching sheet columns:
  // Fecha | Semana | Mes | Zona | Productos | Cantidad | Precio Unitario | Total Venta | Envío | Total Pedido | Pagado | Saldo | Estado
  const rows = pedido.productos.map((pr, i) => [
    formatFecha(pedido.fecha),               // Fecha
    pedido.semana || '',                      // Semana
    pedido.mes || '',                         // Mes
    pedido.zona || '',                        // Zona (provincia)
    pr.nombre,                                // Productos
    pr.cant,                                  // Cantidad
    pr.precio,                                // Precio Unitario
    pr.total,                                 // Total Venta
    i === 0 ? (pedido.envio || '') : '',      // Envío (solo primera fila)
    i === 0 ? pedido.total : '',              // Total Pedido (solo primera fila)
    i === 0 ? (pedido.pagado || '') : '',     // Pagado (solo primera fila)
    i === 0 ? (pedido.saldo || '') : '',      // Saldo (solo primera fila)
    i === 0 ? pedido.estado : ''              // Estado (solo primera fila)
  ]);

  fetch(SHEETS_URL, {
    method: 'POST',
    mode: 'no-cors',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({rows: rows})
  }).catch(err => console.error('Error enviando a Sheets:', err));
}

const PRODUCTOS_DEFAULT = [
  'Torta Chilena 8 porciones','Torta chilena de 6 porciones',
  'Pastel Vainilla Chips y Dulce de Leche 10 porciones',
  'Pastel Limon Cremoso y Dulce de leche 10 porciones',
  'Pastel Vainilla y Cheescake Fresa 10 porciones',
  'Pastel Chocolate y dulce de leche 10 porciones',
  'Pastel de Chocolate','Queque de Banano 2 Libras',
  'Rollos de Canela','Cheescake Fresa','Dulce de Leche',
  'Leche Cond Tradicional DP','Leche Cond Sabor Fresa DP',
  'Leche Cond Sabor Chocolate DP','Litro Leche Cond Tradicional',
  '1/2 Litro Leche Cond Tradicional','Mermelada Piña Maracuya'
];

function getCatalogo(){
  const saved = localStorage.getItem('dp_catalogo');
  if(saved) return JSON.parse(saved);
  // First time: load defaults
  localStorage.setItem('dp_catalogo', JSON.stringify(PRODUCTOS_DEFAULT));
  return PRODUCTOS_DEFAULT;
}

function saveCatalogo(lista){
  localStorage.setItem('dp_catalogo', JSON.stringify(lista));
}

function agregarProductoCatalogo(){
  const input = document.getElementById('nuevo-producto');
  const nombre = input.value.trim();
  if(!nombre){ alert('Escribí el nombre del producto'); return; }
  const catalogo = getCatalogo();
  if(catalogo.includes(nombre)){ alert('Ese producto ya existe'); return; }
  catalogo.push(nombre);
  saveCatalogo(catalogo);
  input.value = '';
  renderCatalogo();
  alert('✅ Producto agregado: ' + nombre);
}

function eliminarProductoCatalogo(nombre){
  if(!confirm('¿Eliminar "' + nombre + '" del catálogo?')) return;
  const catalogo = getCatalogo().filter(p => p !== nombre);
  saveCatalogo(catalogo);
  renderCatalogo();
}

function renderCatalogo(){
  const catalogo = getCatalogo();
  const cont = document.getElementById('catalogo-lista');
  if(!catalogo.length){
    cont.innerHTML = '<div class="empty">No hay productos en el catálogo</div>';
    return;
  }
  cont.innerHTML = catalogo.map(p => `
    <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:#fff;border:1px solid #f0dde0;border-radius:8px;margin-bottom:6px">
      <span style="font-size:13px;color:#1a1a1a">${p}</span>
      <button class="btn-icon" onclick="eliminarProductoCatalogo('${p.replace(/'/g,"\'")}')"><i class="ti ti-trash"></i></button>
    </div>
  `).join('');
}

addProducto();
renderCatalogo();
